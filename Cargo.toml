[workspace]
resolver = "2"
members = [
    "crates/neuterm",
    "crates/neuterm-config",
    "crates/neuterm-term",
    "crates/neuterm-mux",
    "crates/neuterm-triggers",
    "crates/neuterm-ai",
]
default-members = ["crates/neuterm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/example/neuterm"
authors = ["NeuTerm Contributors"]

[workspace.dependencies]
neuterm-config = { path = "crates/neuterm-config" }
neuterm-term = { path = "crates/neuterm-term" }
neuterm-mux = { path = "crates/neuterm-mux" }
neuterm-triggers = { path = "crates/neuterm-triggers" }
neuterm-ai = { path = "crates/neuterm-ai" }

serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
dirs = "6"
notify = "8.2.0"
regex = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"
vte = "0.13"
winit = "0.30"
softbuffer = "0.4"
cosmic-text = "0.14"
fontdue = "0.9"
arboard = "3"
raw-window-handle = "0.6"
futures-util = "0.3"
