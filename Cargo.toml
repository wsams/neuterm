[workspace]
resolver = "2"
members = [
    "crates/neuterm",
    "crates/neuterm-config",
    "crates/neuterm-term",
    "crates/neuterm-mux",
    "crates/neuterm-triggers",
    "crates/neuterm-ai",
]
default-members = ["crates/neuterm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/example/neuterm"
authors = ["NeuTerm Contributors"]

[workspace.dependencies]
neuterm-config = { path = "crates/neuterm-config" }
neuterm-term = { path = "crates/neuterm-term" }
neuterm-mux = { path = "crates/neuterm-mux" }
neuterm-triggers = { path = "crates/neuterm-triggers" }
neuterm-ai = { path = "crates/neuterm-ai" }

serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
dirs = "6"
notify = "7"
regex = "1.13.1"
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1.0.151"
parking_lot = "0.12.5"
uuid = { version = "1.24.0", features = ["v4"] }
portable-pty = "0.9.0"
vte = "0.15.0"
winit = "0.30.13"
softbuffer = "0.4.8"
cosmic-text = "0.19.0"
fontdue = "0.9.4"
arboard = "3.6.1"
raw-window-handle = "0.6.2"
futures-util = "0.3.34"
